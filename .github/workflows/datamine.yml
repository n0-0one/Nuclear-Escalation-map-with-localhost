name: Check War Thunder datamine

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Optional full War Thunder datamine commit SHA
        required: false
        type: string
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: datamine-update
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'n0-0one/Nuclear-Escalation-map-with-localhost' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 55
    outputs:
      changed: ${{ steps.datamine.outputs.changed }}
      datamine_commit: ${{ steps.datamine.outputs.datamine_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Test the reviewed extractor and import boundary
        run: |
          python scripts/datamine/tools/test_mission_extraction.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/datamine/test_update.py
      - name: Regenerate mission data from a pinned datamine revision
        id: datamine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATAMINE_COMMIT: ${{ inputs.commit }}
          PYTHONUTF8: '1'
        run: |
          $arguments = @('scripts/datamine/update.py', '--github-output', $env:GITHUB_OUTPUT)
          if ($env:DATAMINE_COMMIT) { $arguments += @('--commit', $env:DATAMINE_COMMIT) }
          python @arguments
      - name: Record the data review report
        if: always()
        run: |
          if (Test-Path '.local/datamine-update-report.md') {
            Get-Content '.local/datamine-update-report.md' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - run: npm ci
        if: steps.datamine.outputs.changed == 'true'
      - run: npm test
        if: steps.datamine.outputs.changed == 'true'
      - run: npm run build
        if: steps.datamine.outputs.changed == 'true'
      - run: npm run test:browser
        if: steps.datamine.outputs.changed == 'true'
      - name: Create a patch containing only generated data
        if: steps.datamine.outputs.changed == 'true'
        run: python scripts/datamine/package_patch.py
      - uses: actions/upload-artifact@v6
        if: steps.datamine.outputs.changed == 'true'
        with:
          name: validated-datamine-patch
          path: |
            .local/datamine.patch
            .local/datamine-update-report.md
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: datamine-browser-failure
          path: test-results

  propose:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: validated-datamine-patch
          path: .local/datamine-validated
      - name: Apply the validated data patch
        run: git apply --check .local/datamine-validated/datamine.patch && git apply .local/datamine-validated/datamine.patch
      - name: Open or refresh the automation branch and draft proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/datamine-update
          delete-branch: false
          draft: true
          commit-message: 'Update Nuclear Escalation data from War Thunder datamine'
          title: 'Datamine update: Nuclear Escalation mission data'
          body: |
            War Thunder mission data was regenerated using the reviewed majorlier extractor.

            - Datamine revision: `${{ needs.generate.outputs.datamine_commit }}`
            - Extraction regressions, schema validation, application tests, production build and browser tests passed before this branch was published.
            - Only the twelve allowlisted JSON data files are included. Our live renderer, interface and desktop integration are preserved.
            - Read the [generation report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and preview the changed scenarios before merging.

            This follows majorlier's draft-update workflow. Merging publishes the web update through the normal main branch checks. Windows distributions require a new build/release.
          add-paths: |
            apps/web/public/map_data.json
            apps/web/public/map_data_mirror.json
            apps/web/public/map_data_city.json
            apps/web/public/map_data_city_mirror.json
            apps/web/public/mission_logic.json
            apps/web/public/mission_logic_mirror.json
            apps/web/public/mission_logic_city.json
            apps/web/public/mission_logic_city_mirror.json
            apps/web/public/presets.json
            apps/web/public/unit_specs.json
            apps/web/public/unit_display_names.json
            apps/web/public/datamine-lock.json
