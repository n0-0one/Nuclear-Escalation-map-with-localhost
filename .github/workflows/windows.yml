name: Windows release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: cargo test --locked -p war-thunder-telemetry -p ntl-bridge
      - run: npm run desktop:build
      - run: ./tests/integration/native-smoke.ps1
      - run: cargo build --locked --release -p ntl-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: Nuclear-Thunder-Live-Windows
          path: |
            target/release/ntl-desktop.exe
            target/release/ntl-bridge.exe
            target/release/bundle/nsis/*.exe
            LICENSES/
            README.md
