name: Windows release artifacts
on:
  workflow_dispatch:
    inputs:
      verify_release:
        description: 'Optional published version tag to verify without rebuilding (for example v0.2.1)'
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    if: ${{ !inputs.verify_release }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Prepare WebView2 Runtime for the native smoke test
        run: ./scripts/ensure-webview2.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: cargo test --locked -p war-thunder-telemetry -p ntl-bridge -p datamine-updater
      - run: npm run desktop:build
      - run: ./tests/integration/native-smoke.ps1
      - name: Save native smoke diagnostics
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-smoke-diagnostics
          path: docs/verification/native-*
          if-no-files-found: ignore
      - run: cargo build --locked --release -p ntl-bridge
      - uses: actions/upload-artifact@v6
        with:
          name: Nuclear-Thunder-Live-Windows
          path: |
            target/release/ntl-desktop.exe
            target/release/ntl-bridge.exe
            target/release/bundle/nsis/*.exe
            LICENSES/
            README.md
  published:
    name: Published Windows EXE
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_release != '' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare WebView2 Runtime for the native smoke test
        run: ./scripts/ensure-webview2.ps1
      - name: Download and verify the published executable
        env:
          NTL_RELEASE_TAG: ${{ inputs.verify_release }}
        run: |
          if ($env:NTL_RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a stable version tag such as v0.2.1.' }
          $base = "https://github.com/n0-0one/Nuclear-Escalation-map-with-localhost-app/releases/download/$env:NTL_RELEASE_TAG"
          $manifest = Invoke-RestMethod -Uri "$base/manifest.json"
          if ("v$($manifest.version)" -ne $env:NTL_RELEASE_TAG) { throw 'Release manifest version mismatch.' }
          $entry = @($manifest.files | Where-Object file -EQ 'Nuclear-Thunder-Live.exe')
          if ($entry.Count -ne 1 -or $entry[0].sha256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid executable manifest entry.' }
          New-Item -ItemType Directory -Path 'target/release' -Force | Out-Null
          $executable = 'target/release/ntl-desktop.exe'
          Invoke-WebRequest -Uri "$base/Nuclear-Thunder-Live.exe" -OutFile $executable
          if ((Get-Item -LiteralPath $executable).Length -ne $entry[0].bytes -or (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry[0].sha256) { throw 'Published executable integrity check failed.' }
          Write-Output "Verified $env:NTL_RELEASE_TAG executable: $($entry[0].sha256)"
      - run: ./tests/integration/native-smoke.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: published-native-smoke-diagnostics
          path: docs/verification/native-*
          if-no-files-found: ignore
