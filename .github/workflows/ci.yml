name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p war-thunder-telemetry -p ntl-bridge
      - run: cargo build --locked --release -p ntl-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/integration/bridge-security.mjs
