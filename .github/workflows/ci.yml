name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/datamine/test_update.py
      - run: python scripts/datamine/test_feed.py
      - run: python scripts/datamine/tools/test_mission_extraction.py
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures
          path: test-results
  rust:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p war-thunder-telemetry -p ntl-bridge -p datamine-updater
      - run: cargo build --locked --release -p ntl-bridge
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tests/integration/bridge-security.mjs
